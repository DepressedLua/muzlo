<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать музыку</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background: #f2f2f7;
        }
        .download-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border: 2px dashed #007aff;
            margin-top: 50px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .sub { color: #666; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background: #007aff;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }
        .btn:active { background: #0055b3; }
        .btn-green { background: #34c759; }
        .btn-green:active { background: #28a745; }
        .list {
            margin-top: 20px;
            text-align: left;
        }
        .item {
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e5ea;
        }
        .item a {
            color: #007aff;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="download-box">
        <h1>🎵 Скачать музыку</h1>
        <p class="sub">Выберите способ скачивания</p>

        </a>
        
        <p style="color:#666; font-size:14px;">или скачайте отдельные треки:</p>
        
        <div class="list">
            <div class="item">
                <span>Трек 1</span>
                <a href="track1.mp3" download>Скачать</a>
            </div>
            <div class="item">
                <span>Трек 2</span>
                <a href="track2.mp3" download>Скачать</a>
            </div>
            <div class="item">
                <span>Трек 3</span>
                <a href="track3.mp3" download>Скачать</a>

</body>
</html>
